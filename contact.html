<html>
    <head>
        <body>

        

<!-- =====================================================
     CONTACT
===================================================== -->

<section class="section contact-section" id="contact">

    <div class="container contact-grid">

        <div class="contact-info">

            <span class="eyebrow">LET'S TALK TRAVEL</span>

            <h2>
                Your next adventure
                <span>starts with a hello.</span>
            </h2>

            <p>
                Have a question about a destination, package,
                or custom trip? We'd love to hear from you.
            </p>

            <div class="contact-details">

                <div>
                    <span>EMAIL</span>
                    <strong>itssoujuu@gmail.com</strong>
                </div>

                <div>
                    <span>PHONE</span>
                    <strong>+91 9398306020</strong>
                </div>

                <div>
                    <span>LOCATION</span>
                    <strong>Eluru,AndhraPradesh,India</strong>
                </div>

            </div>

        </div>


        <form class="contact-form">

            <div class="form-row">

                <div class="form-group">

                    <label>YOUR NAME</label>

                    <input
                        type="text"
                        id="contactName"
                        placeholder="Enter your name"
                    >

                </div>


                <div class="form-group">

                    <label>EMAIL ADDRESS</label>

                    <input
                        type="email"
                        id="contactEmail"
                        placeholder="you@example.com"
                    >

                </div>

            </div>


            <div class="form-group">

                <label>WHAT ARE YOU PLANNING?</label>

                <select id="contactSubject">

                    <option>Select an option</option>
                    <option>Family holiday</option>
                    <option>Couple trip</option>
                    <option>Solo travel</option>
                    <option>Adventure trip</option>
                    <option>Luxury vacation</option>
                    <option>Custom itinerary</option>

                </select>

            </div>


            <div class="form-group">

                <label>YOUR MESSAGE</label>

                <textarea
                    id="contactMessage"
                    rows="5"
                    placeholder="Tell us about your dream trip..."
                ></textarea>

            </div>

            <button
                type="button"
                class="planner-submit"
                id="contactSubmit">
                Send Enquiry →
            </button>
            

            <div id="savedContact" style="display:none; margin-top:25px;">

    <h3>Saved Enquiry</h3>

    <p><strong>Name:</strong> <span id="showContactName"></span></p>

    <p><strong>Email:</strong> <span id="showContactEmail"></span></p>

    <p><strong>Planning:</strong> <span id="showContactSubject"></span></p>

    <p><strong>Message:</strong> <span id="showContactMessage"></span></p>

</div>
        </form>

    </div>

</section>

</main>
</body>
    </head>
</html>
