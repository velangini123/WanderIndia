function showPackage(packageName) {

    window.selectedPackage = packageName;
    const data = packageData[packageName];

    if (!data) return;

    document.getElementById("detailsTag").textContent = data.tag;
    document.getElementById("detailsTitle").textContent = data.title;

    document.getElementById("detailsDuration").textContent = "🌙 " + data.duration;
    document.getElementById("detailsRating").textContent = data.rating;
    document.getElementById("detailsPrice").textContent = data.price;
    document.getElementById("detailsImage").src = data.image;
    document.getElementById("detailsDescription").textContent = data.description;

    const itinerary = document.getElementById("detailsItinerary");
    itinerary.innerHTML = "";

    data.itinerary.forEach(function(item) {
        const p = document.createElement("p");
        p.textContent = item;
        itinerary.appendChild(p);
    });

    const includes = document.getElementById("detailsIncludes");
    includes.innerHTML = "";

    data.includes.forEach(function(item) {
        const li = document.createElement("li");
        li.textContent = item;
        includes.appendChild(li);
    });

    const excludes = document.getElementById("detailsExcludes");
    excludes.innerHTML = "";

    data.excludes.forEach(function(item) {
        const li = document.createElement("li");
        li.textContent = item;
        excludes.appendChild(li);
    });

    const detailsSection = document.getElementById("package-details");

    detailsSection.style.display = "block";
    detailsSection.classList.add("active");

    setTimeout(function() {
        detailsSection.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });
    }, 100);
}

function closePackageDetails() {

    const detailsSection = document.getElementById("package-details");
    const packagesSection = document.getElementById("packages");

    detailsSection.style.display = "none";
    detailsSection.classList.remove("active");

    if (packagesSection) {
        packagesSection.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });
    }
}

function selectPackageForPlanner() {

    const packageName = window.selectedPackage;

    if (!packageName) return;

    const destinationMap = {
        rajasthan: "Rajasthan",
        kerala: "Kerala",
        kashmir: "Kashmir",
        goa: "Goa",
        manali: "Himachal Pradesh",
        darjeeling: "Darjeeling"
    };

    const destination = destinationMap[packageName];
    const data = packageData[packageName];

    if (!destination || !data) return;

    const plannerDestination =
        document.getElementById("plannerDestination");

    const plannerTripLength =
        document.getElementById("triplength");

    if (plannerDestination) {
        plannerDestination.value = destination;
    }

    if (plannerTripLength) {
        plannerTripLength.value = data.duration;
    }
}
